<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027학년도 과천고등학교 학교 설명회 등록부</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #signature-pad {
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            cursor: crosshair;
            touch-action: none; /* 모바일에서 서명 시 화면 스크롤 방지 */
            background-color: #f9fafb;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4 font-sans flex flex-col items-center justify-center">
    
    <main class="w-full max-w-2xl bg-white p-8 md:p-10 rounded-2xl shadow-xl border border-slate-200 relative">
        
        <!-- Header -->
        <div class="text-center mb-8 bg-teal-600 rounded-xl p-6 shadow-md border-b-0">
            <h1 class="text-2xl md:text-3xl font-bold text-white mb-2">2027학년도 과천고등학교</h1>
            <h2 class="text-xl md:text-2xl font-bold text-teal-100">신입생을 위한 학교 설명회 등록부</h2>
            <p class="text-teal-50 mt-3 text-sm">참석을 위해 아래 항목을 모두 작성해 주시기 바랍니다.</p>
        </div>
        
        <form id="registrationForm" class="space-y-8">
            
            <!-- 1. 참석자 구분 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-3">참석자 구분 <span class="text-red-500">*</span></label>
                <div class="space-y-2 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <label class="flex items-center cursor-pointer hover:bg-slate-100 p-2 rounded-lg transition-colors">
                        <input type="radio" name="attendeeType" value="학부모" required class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500 mr-3"> 
                        <span class="text-slate-700">학부모</span>
                    </label>
                    <label class="flex items-center cursor-pointer hover:bg-slate-100 p-2 rounded-lg transition-colors">
                        <input type="radio" name="attendeeType" value="중3학생" class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500 mr-3"> 
                        <span class="text-slate-700">중학교 3학년 학생 본인</span>
                    </label>
                    <label class="flex items-center cursor-pointer hover:bg-slate-100 p-2 rounded-lg transition-colors">
                        <input type="radio" name="attendeeType" value="중1_2학생" class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500 mr-3"> 
                        <span class="text-slate-700">중학교 1~2학년 학생 본인</span>
                    </label>
                    <div class="flex flex-col">
                        <label class="flex items-center cursor-pointer hover:bg-slate-100 p-2 rounded-lg transition-colors">
                            <input type="radio" name="attendeeType" value="기타" id="radioOther" class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500 mr-3"> 
                            <span class="text-slate-700">기타</span>
                        </label>
                        <!-- 기타 선택 시 나타나는 입력 칸 -->
                        <div id="otherInputContainer" class="hidden ml-9 mt-1 pr-2 pb-2">
                            <input type="text" id="otherAttendeeDetails" placeholder="참석자 구분을 직접 입력해주세요" class="w-full border border-slate-300 rounded-md shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-2.5 text-sm transition-all outline-none">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. 참석자 성함 -->
            <div>
                <label for="attendeeName" class="block text-sm font-semibold text-slate-700 mb-2">참석자 성함 <span class="text-red-500">*</span></label>
                <input type="text" id="attendeeName" placeholder="홍길동" required class="w-full border border-slate-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-3.5 transition-all outline-none text-slate-700">
            </div>

            <!-- 3. 투어 희망 여부 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-3">과천고등학교 교내 투어 희망 여부 <span class="text-red-500">*</span></label>
                <div class="flex flex-col sm:flex-row sm:space-x-4 space-y-2 sm:space-y-0 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <label class="flex-1 flex items-center justify-center cursor-pointer bg-white border border-slate-200 p-3 rounded-lg hover:border-blue-400 hover:bg-blue-50 transition-all">
                        <input type="radio" name="tour" value="희망함" required class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500 mr-2"> 
                        <span class="text-slate-700 font-medium">희망함</span>
                    </label>
                    <label class="flex-1 flex items-center justify-center cursor-pointer bg-white border border-slate-200 p-3 rounded-lg hover:border-blue-400 hover:bg-blue-50 transition-all">
                        <input type="radio" name="tour" value="희망하지 않음" class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500 mr-2"> 
                        <span class="text-slate-700 font-medium">희망하지 않음</span>
                    </label>
                </div>
            </div>

            <!-- 6. 서명 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">서명 <span class="text-red-500">*</span></label>
                <p class="text-xs text-slate-500 mb-3">아래 빈칸에 마우스나 손가락을 이용해 서명해 주세요.</p>
                <canvas id="signature-pad" class="w-full h-48"></canvas>
                <div class="flex justify-between items-center mt-3">
                    <p id="signatureError" class="text-red-500 text-sm hidden">서명을 입력해 주세요.</p>
                    <button type="button" id="clear-signature" class="ml-auto text-sm text-slate-600 hover:text-slate-900 font-medium bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded-lg transition-colors">지우기</button>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="pt-6 border-t border-slate-100">
                <button type="submit" class="w-full bg-teal-600 text-white font-bold text-lg py-4 px-4 rounded-xl shadow-lg shadow-teal-200 hover:bg-teal-700 hover:shadow-teal-300 hover:-translate-y-0.5 focus:outline-none focus:ring-4 focus:ring-teal-500 focus:ring-opacity-50 transition-all duration-200 active:translate-y-0">
                    등록 완료하기
                </button>
            </div>
        </form>
    </main>

    <div id="successModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 shadow-2xl transform scale-95 transition-transform duration-300 flex flex-col items-center text-center">
            <div class="w-16 h-16 bg-green-100 text-green-500 rounded-full flex items-center justify-center mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h3 class="text-xl font-bold text-slate-800 mb-2">등록이 완료되었습니다</h3>
            <p class="text-slate-600 text-sm mb-6">설명회 신청이 성공적으로 접수되었습니다.<br>참여해 주셔서 감사합니다.</p>
            <button id="closeModalBtn" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold py-3 px-4 rounded-xl transition-colors">
                확인
            </button>
        </div>
    </div>

    <script>
        // --- 기타 입력란 토글 로직 ---
        const attendeeRadios = document.querySelectorAll('input[name="attendeeType"]');
        const otherInputContainer = document.getElementById('otherInputContainer');
        const otherAttendeeDetails = document.getElementById('otherAttendeeDetails');

        attendeeRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === '기타') {
                    otherInputContainer.classList.remove('hidden');
                    otherAttendeeDetails.required = true;
                    setTimeout(() => otherAttendeeDetails.focus(), 50); // 자연스러운 포커스 이동
                } else {
                    otherInputContainer.classList.add('hidden');
                    otherAttendeeDetails.required = false;
                    otherAttendeeDetails.value = ''; // 값 초기화
                }
            });
        });

        // --- 서명 패드 로직 ---
        const canvas = document.getElementById('signature-pad');
        const ctx = canvas.getContext('2d');
        const signatureError = document.getElementById('signatureError');
        let isDrawing = false;

        // 고해상도 디스플레이(Retina) 지원을 위한 캔버스 크기 조정
        function resizeCanvas() {
            const ratio = Math.max(window.devicePixelRatio || 1, 1);
            const rect = canvas.getBoundingClientRect();
            
            // 캔버스의 실제 크기를 픽셀 비율에 맞게 설정
            canvas.width = rect.width * ratio;
            canvas.height = rect.height * ratio;
            ctx.scale(ratio, ratio);
            
            // 서명 선 스타일
            ctx.strokeStyle = "#1e293b"; // slate-800
            ctx.lineWidth = 3;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
        }
        
        window.addEventListener("resize", () => {
            // 리사이즈 시 기존 서명이 날아가는 것을 방지하기 위해 데이터를 임시 저장
            const dataUrl = canvas.toDataURL();
            resizeCanvas();
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);
            img.src = dataUrl;
        });
        
        // 초기 설정
        setTimeout(resizeCanvas, 100);

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches && e.touches.length > 0) {
                return {
                    x: e.touches[0].clientX - rect.left,
                    y: e.touches[0].clientY - rect.top
                };
            }
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function startDrawing(e) {
            e.preventDefault(); 
            isDrawing = true;
            signatureError.classList.add('hidden'); // 그리기 시작하면 에러 메시지 숨김
            const pos = getCoordinates(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getCoordinates(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function stopDrawing() {
            if(isDrawing) {
                ctx.closePath();
                isDrawing = false;
            }
        }

        // 마우스 및 터치 이벤트 리스너
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchcancel', stopDrawing);

        // 지우기 버튼
        document.getElementById('clear-signature').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // --- 폼 제출 및 모달 로직 ---
        const form = document.getElementById('registrationForm');
        const modal = document.getElementById('successModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalContent = modal.querySelector('div');

        // 서명 빈값 확인 함수
        const isCanvasBlank = (c) => {
            const pixelBuffer = new Uint32Array(
                c.getContext('2d').getImageData(0, 0, c.width, c.height).data.buffer
            );
            return !pixelBuffer.some(color => color !== 0);
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            // 서명 검증
            if (isCanvasBlank(canvas)) {
                signatureError.classList.remove('hidden');
                canvas.classList.add('border-red-400', 'ring-2', 'ring-red-200');
                setTimeout(() => {
                    canvas.classList.remove('border-red-400', 'ring-2', 'ring-red-200');
                }, 2000);
                // 서명 패드로 스크롤 이동
                canvas.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }

            // 제출 버튼 비활성화 (중복 제출 방지)
            const submitBtn = form.querySelector('button[type="submit"]');
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '제출 중...';

            // 데이터 수집
            const formData = new FormData();
            
            // 참석자 구분
            const attendeeType = document.querySelector('input[name="attendeeType"]:checked').value;
            formData.append('attendeeType', attendeeType === '기타' ? document.getElementById('otherAttendeeDetails').value : attendeeType);
            
            // 참석자 이름
            formData.append('attendeeName', document.getElementById('attendeeName').value);
            
            // 투어 희망 여부
            formData.append('tour', document.querySelector('input[name="tour"]:checked').value);
            
            // 서명 이미지 (Base64 인코딩)
            formData.append('signature', canvas.toDataURL('image/png'));

            // ★ 아래 따옴표 사이에 발급받으신 구글 웹앱 URL을 붙여넣으세요. ★
            const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzi8dB0my3tCleaytcRaRtKUfiKt39YXaHHmLXzTfZv163xmOHJtqagF7aeEdbr_WEB/exec'; 

            // URL이 기본값이거나 유효하지 않은 경우 전송을 막고 안내 메시지 출력
            if (GOOGLE_SCRIPT_URL === '여기에_웹앱_URL을_붙여넣으세요' || !GOOGLE_SCRIPT_URL.startsWith('http')) {
                alert('⚠️ 구글 스프레드시트와 아직 연결되지 않았습니다!\n\n코드 안의 GOOGLE_SCRIPT_URL 변수에 발급받으신 웹앱 주소(https://...)를 먼저 입력해 주세요.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnText;
                return; // 잘못된 주소로 fetch 요청을 보내는 것을 차단합니다.
            }

            // 구글 시트로 데이터 전송 (no-cors 모드 추가하여 에러 알림 방지)
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: formData,
                mode: 'no-cors' 
            })
            .then(() => {
                // 정상적으로 전송 완료 처리
                showSuccessModal();
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert('제출 중 문제가 발생했습니다. 스크립트 주소나 인터넷 연결을 확인해주세요.');
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnText;
            });
        });
        
        function showSuccessModal() {
            // 모달 열기
            modal.classList.remove('hidden');
            // 애니메이션을 위해 약간의 지연 시간 후 클래스 추가
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            });
        }

        // 모달 닫기 로직
        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            // 트랜지션 완료 후 hidden 처리 및 폼 초기화
            setTimeout(() => {
                modal.classList.add('hidden');
                
                // 폼 초기화
                form.reset();
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                otherInputContainer.classList.add('hidden');
                
                // 화면 최상단으로 이동
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 300);
        }

        closeModalBtn.addEventListener('click', closeModal);
    </script>
</body>
</html>
